<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>财务小助理</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: "Microsoft Yahei", system-ui, sans-serif;
        }

        body {
            background-color: #f5f7fa;
            padding: 12px;
            max-width: 1300px;
            margin: 0 auto;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 14px;
            background: #ffffff;
            border-radius: 10px;
            border: 1px solid #e4e7ed;
            margin-bottom: 12px;
        }

        .user-message {
            text-align: right;
            margin: 10px 0;
        }
        .user-message .content {
            display: inline-block;
            background: #409EFF;
            color: #ffffff;
            padding: 9px 14px;
            border-radius: 16px 3px 16px 16px;
            max-width: 82%;
            text-align: left;
            line-height: 1.7;
        }

        .bot-message {
            text-align: left;
            margin: 10px 0;
        }
        .bot-message .content {
            display: inline-block;
            background: #ecf5ff;
            color: #303133;
            padding: 9px 14px;
            border-radius: 3px 16px 16px 16px;
            max-width: 82%;
            line-height: 1.7;
        }

        .input-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        #user-input {
            flex: 1;
            min-width: 220px;
            padding: 11px 14px;
            border: 1px solid #dcdfe6;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        #user-input:focus {
            border-color: #409EFF;
        }

        button {
            padding: 11px 22px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }
        #send-btn {
            background-color: #409EFF;
            color: white;
        }

        .feedback-area {
            margin-top: 10px;
        }
        .feedback-btn {
            background: #67C23A;
            color: #fff;
            margin-right: 10px;
        }
        .feedback-btn:nth-child(2) {
            background: #E6A23C;
        }

        .loading {
            color: #909399;
            padding: 4px 14px;
        }
    </style>
</head>
<body>
    <div class="chat-container" id="chatBox"></div>

    <div class="input-wrapper">
        <input id="user-input" placeholder="请输入报销、OA、用章等财务相关问题">
        <button id="send-btn" onclick="sendQuestion()">发送</button>
    </div>

    <div class="feedback-area">
        <button class="feedback-btn" onclick="submitFeedback('已解决')">已解决</button>
        <button class="feedback-btn" onclick="submitFeedback('未解决')">未解决</button>
    </div>

<script>
// 固定配置，无需修改
const API_URL = "https://deap-api.dingtalk.com/v1/agent/chat";
// 你的完整SK，已完整录入
const DEAP_SK = "sk-626qnsg42ba5oc7aycjfca9czrbre407";
// 直接填写机器人中文名，不用找ID，适配DEAP中文名匹配
const AGENT_ID = "财务小助理";

const chatBox = document.getElementById("chatBox");
const inputDom = document.getElementById("user-input");

async function sendQuestion() {
    const question = inputDom.value.trim();
    if (!question) return alert("请输入需要咨询的问题");

    appendMsg("user", question);
    inputDom.value = "";
    appendMsg("bot", "<span class='loading'>正在查询知识库，请稍候...</span>");

    try {
        const resp = await fetch(API_URL, {
            method: "POST",
            headers: {
                "Content-Type": "application/json",
                // Bearer后严格保留1个空格，格式绝对规范
                "Authorization": "Bearer " + DEAP_SK
            },
            body: JSON.stringify({
                query: question,
                // 字段严格小写驼峰：assistantId，大小写不能错
                assistantId: AGENT_ID
            })
        });

        const resData = await resp.json();
        chatBox.removeChild(chatBox.lastChild);

        if (resData.answer) {
            appendMsg("bot", resData.answer);
        } else {
            appendMsg("bot", "接口返回无答案，请确认API权限仅绑定财务小助理。");
        }

    } catch (error) {
        chatBox.removeChild(chatBox.lastChild);
        // 区分网络跨域和接口报错
        if(error.name === "TypeError"){
            appendMsg("bot", "浏览器跨域拦截！解决方法：cmd进入网页文件夹执行 python -m http.server 8080，浏览器打开 http://127.0.0.1:8080");
        }else{
            appendMsg("bot", "接口调用失败，请核对：1.SK无多余空格 2.权限仅授权财务小助理 3.网络可访问外网");
        }
        console.error("请求详情：", error);
    }
}

function appendMsg(type, htmlText) {
    const div = document.createElement("div");
    div.className = type === "user" ? "user-message" : "bot-message";
    div.innerHTML = `<div class="content">${htmlText}</div>`;
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}

function submitFeedback(status) {
    alert(`本次反馈状态：${status}`);
}

inputDom.addEventListener("keydown", function (e) {
    if (e.key === "Enter") sendQuestion();
})
</script>
</body>
</html>
