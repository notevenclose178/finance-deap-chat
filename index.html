<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>财务小助理 · 智能问答</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz@14..32&display=swap" rel="stylesheet" />
    <style>
        /* ===== 全局重置 ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background: #f0f4fb;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            color: #1e293b;
        }

        /* ===== 顶部导航 — 精致毛玻璃 ===== */
        .custom-header {
            background: rgba(11, 26, 51, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 12px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-shrink: 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.08);
            z-index: 20;
            min-height: 68px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .header-logo {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #f6d365, #fda085);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: 700;
            color: #0b1a33;
            box-shadow: 0 8px 24px rgba(253, 160, 133, 0.35);
        }

        .header-title {
            color: #ffffff;
            font-weight: 600;
            font-size: 20px;
            letter-spacing: -0.2px;
        }

        .header-title span {
            background: linear-gradient(135deg, #f6d365, #fda085);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .header-sub {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            font-weight: 400;
            letter-spacing: 0.3px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header-badge {
            background: rgba(255, 255, 255, 0.06);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            color: rgba(255, 255, 255, 0.85);
            padding: 6px 16px;
            border-radius: 30px;
            font-size: 12px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .header-badge i {
            color: #34d399;
            font-size: 10px;
        }

        /* ===== 主内容区 ===== */
        .main-wrapper {
            flex: 1;
            display: flex;
            flex-direction: row;
            overflow: hidden;
            background: #f0f4fb;
            gap: 0;
        }

        /* ===== iframe 容器 ===== */
        .iframe-container {
            flex: 1;
            position: relative;
            background: #ffffff;
            margin: 12px 0 12px 12px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.08);
            overflow: hidden;
            border: 1px solid rgba(255, 255, 255, 0.3);
            min-height: 0; /* 防止 flex 溢出 */
        }

        .iframe-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }

        /* ===== 反馈面板（右侧）— 磨砂玻璃 ===== */
        .feedback-panel {
            width: 260px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(255, 255, 255, 0.5);
            padding: 28px 20px;
            display: flex;
            flex-direction: column;
            gap: 18px;
            flex-shrink: 0;
            overflow-y: auto;
            margin: 12px 12px 12px 0;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 20, 40, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .feedback-panel .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .feedback-panel .panel-header i {
            font-size: 22px;
            color: #f59e0b;
            background: rgba(245, 158, 11, 0.12);
            padding: 8px;
            border-radius: 12px;
        }

        .feedback-panel .panel-header h4 {
            font-size: 16px;
            font-weight: 600;
            color: #0b1a33;
            margin: 0;
        }

        .feedback-panel .panel-desc {
            font-size: 13px;
            color: #64748b;
            line-height: 1.5;
            margin-top: -4px;
            padding-left: 4px;
        }

        .feedback-btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 4px;
        }

        .feedback-btn {
            padding: 12px 0;
            border: none;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.22, 1, 0.36, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }

        .feedback-btn.solved {
            color: #059669;
            background: rgba(52, 211, 153, 0.12);
            border-color: rgba(52, 211, 153, 0.25);
        }

        .feedback-btn.solved:hover {
            background: rgba(52, 211, 153, 0.22);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(52, 211, 153, 0.20);
        }

        .feedback-btn.unsolved {
            color: #dc2626;
            background: rgba(239, 68, 68, 0.08);
            border-color: rgba(239, 68, 68, 0.15);
        }

        .feedback-btn.unsolved:hover {
            background: rgba(239, 68, 68, 0.18);
            transform: translateY(-2px) scale(1.02);
            box-shadow: 0 8px 24px rgba(239, 68, 68, 0.15);
        }

        .feedback-btn i {
            font-size: 18px;
        }

        .feedback-note {
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
            padding-top: 6px;
            border-top: 1px dashed rgba(148, 163, 184, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .feedback-note i {
            color: #f59e0b;
        }

        /* ===== 模态框 — 更精致 ===== */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.35);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            opacity: 0;
            visibility: hidden;
            transition: all 0.4s ease;
            padding: 20px;
        }

        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-box {
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border-radius: 32px;
            max-width: 500px;
            width: 100%;
            padding: 32px 32px 28px;
            box-shadow: 0 40px 100px rgba(0, 0, 0, 0.15);
            transform: translateY(30px) scale(0.96);
            transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .modal-overlay.active .modal-box {
            transform: translateY(0) scale(1);
        }

        .modal-box h2 {
            font-size: 22px;
            font-weight: 700;
            color: #0b1a33;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .modal-box h2 i {
            color: #dc2626;
            background: rgba(239, 68, 68, 0.10);
            padding: 10px;
            border-radius: 16px;
            font-size: 20px;
        }

        .modal-box .modal-sub {
            color: #64748b;
            font-size: 14px;
            margin-bottom: 24px;
            line-height: 1.6;
            padding-left: 4px;
        }

        .modal-box .form-group {
            margin-bottom: 18px;
        }

        .modal-box .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #334155;
            margin-bottom: 5px;
            letter-spacing: 0.2px;
        }

        .modal-box .form-group label .required {
            color: #dc2626;
            margin-left: 2px;
        }

        .modal-box .form-group label i {
            color: #94a3b8;
            margin-right: 6px;
        }

        .modal-box .form-group textarea,
        .modal-box .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid rgba(226, 232, 240, 0.6);
            border-radius: 14px;
            font-size: 14px;
            font-family: inherit;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
            transition: all 0.2s ease;
            color: #1e293b;
            outline: none;
        }

        .modal-box .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-box .form-group textarea:focus,
        .modal-box .form-group input:focus {
            border-color: #f59e0b;
            background: rgba(255, 255, 255, 0.8);
            box-shadow: 0 0 0 4px rgba(245, 158, 11, 0.10);
        }

        .modal-box .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 24px;
        }

        .modal-box .form-actions button {
            flex: 1;
            padding: 12px 0;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .modal-box .form-actions .btn-primary {
            background: linear-gradient(135deg, #dc2626, #b91c1c);
            color: #ffffff;
            box-shadow: 0 4px 16px rgba(220, 38, 38, 0.25);
        }

        .modal-box .form-actions .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 28px rgba(220, 38, 38, 0.35);
        }

        .modal-box .form-actions .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .modal-box .form-actions .btn-secondary {
            background: rgba(255, 255, 255, 0.5);
            color: #475569;
            border: 1px solid rgba(226, 232, 240, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-box .form-actions .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.8);
        }

        /* ===== 底部状态栏 ===== */
        .custom-footer {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 8px 28px;
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #94a3b8;
            border-top: 1px solid rgba(255, 255, 255, 0.4);
            flex-shrink: 0;
        }

        .custom-footer .footer-left i {
            color: #34d399;
            margin-right: 6px;
            font-size: 8px;
        }

        .custom-footer .footer-right i {
            color: #f59e0b;
            margin-right: 6px;
        }

        /* ===== Toast 通知 ===== */
        .toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            color: white;
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
            z-index: 1000;
            transition: opacity 0.4s ease, transform 0.4s ease;
            opacity: 0;
            transform: translateX(-50%) translateY(10px);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.08);
            max-width: 90%;
            text-align: center;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        .toast.success {
            background: rgba(5, 150, 105, 0.92);
        }

        .toast.error {
            background: rgba(220, 38, 38, 0.92);
        }

        /* ===== 响应式设计：手机端精简反馈面板 ===== */
        @media (max-width: 820px) {
            .main-wrapper {
                flex-direction: column;
                gap: 0;
            }

            .iframe-container {
                margin: 10px 10px 0 10px;
                border-radius: 20px;
                flex: 1;
                min-height: 0;
            }

            .feedback-panel {
                width: auto;
                flex-direction: row;
                flex-wrap: nowrap;
                align-items: center;
                justify-content: space-between;
                margin: 6px 10px 10px 10px;
                padding: 6px 12px;
                border-radius: 16px;
                gap: 6px;
                border-left: none;
                border-top: 1px solid rgba(255, 255, 255, 0.3);
                max-height: 50px;
                overflow: hidden;
                flex-shrink: 0;
            }

            .feedback-panel .panel-header {
                flex: 0 0 auto;
                gap: 4px;
            }

            .feedback-panel .panel-header i {
                font-size: 14px;
                padding: 4px;
                border-radius: 8px;
            }

            .feedback-panel .panel-header h4 {
                font-size: 12px;
                margin: 0;
            }

            .feedback-panel .panel-desc {
                display: none;
            }

            .feedback-btn-group {
                flex-direction: row;
                margin-top: 0;
                gap: 4px;
            }

            .feedback-btn {
                padding: 4px 12px;
                font-size: 11px;
                border-radius: 20px;
                gap: 4px;
                min-width: 60px;
            }

            .feedback-btn i {
                font-size: 12px;
            }

            .feedback-note {
                display: none;
            }
        }

        @media (max-width: 480px) {
            .custom-header {
                padding: 8px 16px;
                min-height: 56px;
            }
            .header-logo {
                width: 34px;
                height: 34px;
                font-size: 16px;
            }
            .header-title {
                font-size: 16px;
            }
            .header-sub {
                font-size: 10px;
            }
            .header-badge {
                font-size: 10px;
                padding: 4px 12px;
            }
            .feedback-panel {
                padding: 4px 10px;
                max-height: 44px;
                margin: 4px 10px 10px 10px;
            }
            .feedback-btn {
                padding: 3px 10px;
                font-size: 10px;
                min-width: 50px;
            }
            .modal-box {
                padding: 24px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- ===== 顶部导航 ===== -->
    <header class="custom-header">
        <div class="header-left">
            <div class="header-logo">
                <i class="fas fa-calculator"></i>
            </div>
            <div>
                <div class="header-title">财务<span>小助理</span></div>
                <div class="header-sub">智能问答 · 基于 DEAP</div>
            </div>
        </div>
        <div class="header-right">
            <span class="header-badge">
                <i class="fas fa-circle"></i> 在线
            </span>
        </div>
    </header>

    <!-- ===== 主内容区 ===== -->
    <div class="main-wrapper">
        <!-- iframe 区域：嵌入 DEAP 智能体 -->
        <div class="iframe-container">
            <iframe
                id="deapIframe"
                src="https://deap-agent.dingtalk.com/h5/index.html?publish_h5=1&code=0df84989-3a53-47ab-b08f-407a5670fc12"
                allow="microphone; camera; clipboard-read; clipboard-write"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-modals"
            ></iframe>
        </div>

        <!-- 反馈面板 -->
        <div class="feedback-panel">
            <div class="panel-header">
                <i class="fas fa-comment-dots"></i>
                <h4>问题反馈</h4>
            </div>
            <div class="panel-desc">该回答是否解决了您的问题？</div>
            <div class="feedback-btn-group">
                <button class="feedback-btn solved" id="solvedBtn">
                    <i class="fas fa-check-circle"></i> 已解决
                </button>
                <button class="feedback-btn unsolved" id="unsolvedBtn">
                    <i class="fas fa-times-circle"></i> 未解决
                </button>
            </div>
            <div class="feedback-note">
                <i class="fas fa-info-circle"></i> 未解决将通知管理员
            </div>
        </div>
    </div>

    <!-- ===== 底部状态栏 ===== -->
    <div class="custom-footer">
        <span class="footer-left">
            <i class="fas fa-circle"></i> 服务正常
        </span>
        <span class="footer-right">
            <i class="fas fa-lock"></i> 钉钉安全加密
        </span>
    </div>

    <!-- ===== 反馈弹窗 ===== -->
    <div class="modal-overlay" id="feedbackModal">
        <div class="modal-box">
            <h2>
                <i class="fas fa-exclamation-circle"></i> 问题未解决
            </h2>
            <p class="modal-sub">请简要描述您遇到的问题，我们会尽快联系您。</p>

            <div class="form-group">
                <label><i class="fas fa-user"></i> 您的姓名 <span class="required">*</span></label>
                <input type="text" id="userName" placeholder="请输入您的姓名" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone"></i> 钉钉号 <span class="required">*</span></label>
                <input type="text" id="userContact" placeholder="请输入您的钉钉号" />
            </div>
            <div class="form-group">
                <label><i class="fas fa-pencil-alt"></i> 您刚才问了什么问题？ <span class="required">*</span></label>
                <textarea id="issueDesc" placeholder="请简述您刚才向智能体提出的问题，以及为什么认为回答未解决"></textarea>
            </div>

            <div class="form-actions">
                <button class="btn-secondary" id="modalCancel">取消</button>
                <button class="btn-primary" id="modalSubmit">
                    <i class="fas fa-paper-plane"></i> 提交反馈
                </button>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  🔧 阿里云函数计算后端地址（已配置好，请勿修改）
            // ============================================================
            const API_BACKEND = 'https://feedbacroxy-web-sigigkprpt.cn-hangzhou.fcapp.run';

            // DOM 元素
            const solvedBtn = document.getElementById('solvedBtn');
            const unsolvedBtn = document.getElementById('unsolvedBtn');
            const modal = document.getElementById('feedbackModal');
            const cancelBtn = document.getElementById('modalCancel');
            const submitBtn = document.getElementById('modalSubmit');
            const userName = document.getElementById('userName');
            const userContact = document.getElementById('userContact');
            const issueDesc = document.getElementById('issueDesc');

            // ===== Toast 通知 =====
            function showToast(message, type) {
                const existing = document.querySelector('.toast');
                if (existing) existing.remove();

                const toast = document.createElement('div');
                toast.className = 'toast';
                if (type === 'success') toast.classList.add('success');
                if (type === 'error') toast.classList.add('error');
                toast.textContent = message;
                document.body.appendChild(toast);

                requestAnimationFrame(() => {
                    toast.classList.add('show');
                });

                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }

            // ===== 发送钉钉消息（通过阿里云函数计算后端） =====
            async function sendDingTalkMessage(user, contact, desc) {
                try {
                    const response = await fetch(API_BACKEND, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ user, contact, desc })
                    });

                    const result = await response.json();

                    if (result.success) {
                        showToast('✅ 反馈已发送，管理员将很快联系您', 'success');
                    } else {
                        showToast('❌ 提交失败：' + (result.error || '未知错误'), 'error');
                    }
                } catch (e) {
                    console.error('请求后端失败', e);
                    showToast('❌ 网络异常，请稍后重试', 'error');
                }
            }

            // ===== 事件绑定 =====

            // 已解决按钮
            solvedBtn.addEventListener('click', function() {
                showToast('✅ 已解决，感谢您的反馈！', 'success');
            });

            // 未解决按钮 → 打开弹窗
            unsolvedBtn.addEventListener('click', function() {
                userName.value = '';
                userContact.value = '';
                issueDesc.value = '';
                modal.classList.add('active');
            });

            // 关闭弹窗
            function closeModal() {
                modal.classList.remove('active');
            }

            cancelBtn.addEventListener('click', closeModal);

            // 点击蒙层关闭
            modal.addEventListener('click', function(e) {
                if (e.target === modal) closeModal();
            });

            // 提交反馈
            submitBtn.addEventListener('click', async function() {
                const name = userName.value.trim();
                const contact = userContact.value.trim();
                const desc = issueDesc.value.trim();

                // 校验必填项
                if (!name) {
                    showToast('请填写您的姓名', 'error');
                    userName.focus();
                    return;
                }
                if (!contact) {
                    showToast('请填写您的钉钉号', 'error');
                    userContact.focus();
                    return;
                }
                if (!desc) {
                    showToast('请描述您刚才问了什么问题', 'error');
                    issueDesc.focus();
                    return;
                }

                // 禁用按钮，防止重复提交
                submitBtn.disabled = true;
                submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 发送中...';

                await sendDingTalkMessage(name, contact, desc);

                // 恢复按钮状态
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-paper-plane"></i> 提交反馈';

                // 关闭弹窗
                closeModal();
            });

            // ===== iframe 加载完成日志 =====
            document.getElementById('deapIframe').addEventListener('load', function() {
                console.log('✅ DEAP 智能体已加载');
            });

        })();
    </script>
